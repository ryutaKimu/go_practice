name: minato-inventory

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: minato
      POSTGRES_PASSWORD: minato_local_only
      POSTGRES_DB: minato
    ports:
      # 5432 はローカルの他プロジェクトと衝突しやすいのでずらす
      - "55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # api がマイグレーション前に起動しないよう、受付可能になるまで待たせる
      test: ["CMD-SHELL", "pg_isready -U minato -d minato"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 使い捨てのワンショットジョブ。マイグレーションを適用したら終了する。
  # `Exited (0)` が正常な最終状態であり、常駐しないのが正しい。
  # 終了コード0を待って api が起動するので、ここが失敗すれば api も起動しない。
  migrate:
    image: migrate/migrate:v4.18.1
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://minato:minato_local_only@db:5432/minato?sslmode=disable"
      - "up"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://minato:minato_local_only@db:5432/minato?sslmode=disable"
      LOG_LEVEL: "debug"
      APP_VERSION: "local"
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: node:24-alpine
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Vite の dev サーバはコンテナ内なので 0.0.0.0 で待ち受ける必要がある
      VITE_API_BASE_URL: "http://localhost:8080/api/v1"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  db_data:
  web_node_modules:
